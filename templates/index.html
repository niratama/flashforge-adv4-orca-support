<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashforge Adventurer 4 - OrcaSlicer Bridge</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #1c2026;
      --border: #2c323b;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #00ae42;
      --accent-hover: #00c84c;
      --warn: #d29922;
      --danger: #f85149;
      --info: #58a6ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
    }

    .title-group .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.online { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot.warn { background: var(--warn); }
    .dot.offline { background: var(--danger); }

    .cam-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #14171c;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 20px;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      min-width: 0;
    }

    .card h2 {
      margin: 0 0 12px 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #0b0d10;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .camera-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: var(--muted);
      gap: 10px;
    }

    .temp-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      background: #14171c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 1.45rem;
      font-weight: 700;
    }

    .metric-target {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 400;
    }

    .progress-wrap {
      background: #14171c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #252a33;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #2ea043);
      transition: width 0.4s ease;
    }

    .file-info {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #242932;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover { background: #2d333e; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-hover); }

    button.warn { border-color: var(--warn); color: var(--warn); }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button.danger:hover { background: rgba(248, 81, 73, 0.14); }

    .status-msg {
      margin-top: 12px;
      min-height: 20px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .status-msg.error { color: var(--danger); }
    .status-msg.ok { color: var(--accent); }

    .btn-sm {
      padding: 4px 10px;
      font-size: 0.8rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sub-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 860px) {
      .sub-grid { grid-template-columns: 1fr; }
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 240px;
      background: #14171c;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    #temp-chart {
      width: 100%;
      height: 100%;
      display: block;
    }

    .chart-tooltip {
      position: absolute;
      pointer-events: none;
      display: none;
      background: rgba(18, 20, 23, 0.94);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 0.75rem;
      line-height: 1.45;
      color: var(--text);
      white-space: nowrap;
      z-index: 5;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-line {
      width: 16px;
      height: 0;
      border-top: 2px solid currentColor;
    }

    .legend-line.dashed {
      border-top-style: dashed;
    }

    select.range-select {
      background: #242932;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.8rem;
    }

    .snapshot-preview {
      width: 100%;
      height: 240px;
      background: #0b0d10;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .snapshot-preview img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .snapshot-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .snapshot-controls input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .snapshot-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .thumb-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-top: 10px;
      padding-bottom: 4px;
    }

    .thumb-item {
      flex: 0 0 auto;
      width: 72px;
      height: 54px;
      border-radius: 5px;
      overflow: hidden;
      border: 2px solid transparent;
      background: #0b0d10;
      cursor: pointer;
      padding: 0;
    }

    .thumb-item.active {
      border-color: var(--accent);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>Flashforge Adventurer 4</h1>
        <div class="subtitle">Printer IP: <code>{{ printer_ip }}</code></div>
      </div>
      <div class="badge">
        <span id="conn-dot" class="dot"></span>
        <span id="conn-text">接続確認中...</span>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <h2>
          <span>ライブカメラ</span>
          <div class="header-actions">
            <span id="camera-status-badge" class="cam-badge">
              <span id="cam-dot" class="dot"></span>
              <span id="cam-status-text">確認中</span>
            </span>
            <button type="button" class="btn-sm" onclick="captureSnapshot()">撮影</button>
            <button type="button" class="btn-sm" onclick="reconnectCamera()">再接続</button>
          </div>
        </h2>
        <div class="camera-box">
          <img id="camera-img" src="/api/camera/stream" alt="Adventurer 4 Camera Stream" onerror="onCameraError()" onload="onCameraLoad()" />
          <div id="camera-fallback" class="camera-fallback">
            <div>カメラ映像を取得できませんでした</div>
            <div style="font-size: 0.8rem;">URL: <code>{{ camera_url }}</code></div>
            <button type="button" onclick="reconnectCamera()">再試行</button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>ステータス &amp; 操作</h2>

        <div class="temp-grid">
          <div class="metric">
            <div class="metric-label">ノズル温度 (T0)</div>
            <div class="metric-value">
              <span id="nozzle-actual">--</span>°C
              <span class="metric-target">/ <span id="nozzle-target">--</span>°C</span>
            </div>
          </div>
          <div class="metric">
            <div class="metric-label">ベッド温度 (Bed)</div>
            <div class="metric-value">
              <span id="bed-actual">--</span>°C
              <span class="metric-target">/ <span id="bed-target">--</span>°C</span>
            </div>
          </div>
        </div>

        <div class="progress-wrap">
          <div class="progress-header">
            <span id="machine-status">状態: --</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progress-fill" class="progress-bar-fill"></div>
          </div>
          <div class="file-info" id="current-file">ファイル: なし</div>
        </div>

        <div class="controls">
          <button type="button" class="warn" onclick="sendAction('/api/printer/pause', '一時停止を送信しました')">一時停止</button>
          <button type="button" class="primary" onclick="sendAction('/api/printer/resume', '再開を送信しました')">再開</button>
          <button type="button" class="danger" onclick="cancelPrint()">印刷中止</button>
          <button type="button" id="led-btn" onclick="toggleLed()">LED: 切替</button>
        </div>

        <div id="action-msg" class="status-msg"></div>
      </section>
    </div>

    <div class="sub-grid">
      <section class="card">
        <h2>
          <span>温度推移グラフ</span>
          <select id="temp-range" class="range-select" onchange="drawTempChart()">
            <option value="30">直近 30分</option>
            <option value="60">直近 1時間</option>
            <option value="120">直近 2時間</option>
            <option value="240" selected>直近 4時間</option>
          </select>
        </h2>
        <div class="chart-wrap" id="chart-wrap">
          <canvas id="temp-chart"></canvas>
          <div id="chart-tooltip" class="chart-tooltip"></div>
        </div>
        <div class="legend">
          <span class="legend-item" style="color: #f85149;"><span class="legend-line"></span>ノズル実測</span>
          <span class="legend-item" style="color: #ff9b96;"><span class="legend-line dashed"></span>ノズル目標</span>
          <span class="legend-item" style="color: #58a6ff;"><span class="legend-line"></span>ベッド実測</span>
          <span class="legend-item" style="color: #9bc9ff;"><span class="legend-line dashed"></span>ベッド目標</span>
        </div>
      </section>

      <section class="card">
        <h2>
          <span>静止画履歴</span>
          <div class="header-actions">
            <span id="snapshot-policy" style="font-size: 0.75rem; color: var(--muted);"></span>
            <button type="button" class="btn-sm" onclick="fetchSnapshots()">更新</button>
          </div>
        </h2>
        <div class="snapshot-preview" id="snapshot-preview">
          <span>保存された静止画はありません</span>
        </div>
        <div class="snapshot-controls">
          <button type="button" class="btn-sm" id="snap-prev-btn" onclick="stepSnapshot(-1)" disabled>◀</button>
          <input type="range" id="snapshot-slider" min="0" max="0" value="0" oninput="selectSnapshotBySlider(this.value)" disabled />
          <button type="button" class="btn-sm" id="snap-next-btn" onclick="stepSnapshot(1)" disabled>▶</button>
        </div>
        <div class="snapshot-meta">
          <span id="snapshot-time">--</span>
          <span id="snapshot-count">0 / 0</span>
        </div>
        <div class="thumb-strip" id="snapshot-thumbs"></div>
      </section>
    </div>
  </div>

  <script>
    const CAMERA_URL = {{ camera_url | tojson }};
    let currentLedState = false;
    let cameraRetryTimer = null;

    function onCameraError() {
      document.getElementById("camera-img").style.display = "none";
      document.getElementById("camera-fallback").style.display = "flex";
      if (!cameraRetryTimer) {
        cameraRetryTimer = setTimeout(() => {
          cameraRetryTimer = null;
          const img = document.getElementById("camera-img");
          img.style.display = "block";
          document.getElementById("camera-fallback").style.display = "none";
          img.src = "/api/camera/stream?_t=" + Date.now();
        }, 3000);
      }
    }

    function onCameraLoad() {
      if (cameraRetryTimer) {
        clearTimeout(cameraRetryTimer);
        cameraRetryTimer = null;
      }
      document.getElementById("camera-img").style.display = "block";
      document.getElementById("camera-fallback").style.display = "none";
    }

    async function reconnectCamera() {
      if (cameraRetryTimer) {
        clearTimeout(cameraRetryTimer);
        cameraRetryTimer = null;
      }
      try {
        await fetch("/api/camera/reconnect", { method: "POST" });
      } catch (_) {}
      const img = document.getElementById("camera-img");
      img.style.display = "block";
      document.getElementById("camera-fallback").style.display = "none";
      img.src = "/api/camera/stream?_t=" + Date.now();
    }

    async function captureSnapshot() {
      try {
        const res = await fetch("/api/camera/snapshots", { method: "POST" });
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || "撮影に失敗しました");
        }
        setActionMessage(`静止画を保存しました (${data.snapshot.filename})`, false);
        await fetchSnapshots(true);
      } catch (err) {
        setActionMessage(err.message, true);
      }
    }

    function setActionMessage(text, isError = false) {
      const el = document.getElementById("action-msg");
      el.textContent = text;
      el.className = "status-msg " + (isError ? "error" : "ok");
    }

    async function sendAction(url, successText, body = null) {
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : null,
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || "操作に失敗しました");
        }
        setActionMessage(successText, false);
        await fetchStatus();
      } catch (err) {
        setActionMessage(err.message, true);
      }
    }

    function cancelPrint() {
      if (!confirm("印刷を中止しますか？")) return;
      sendAction("/api/printer/cancel", "印刷中止を送信しました");
    }

    function toggleLed() {
      const nextState = !currentLedState;
      sendAction("/api/printer/led", `LEDを${nextState ? "ON" : "OFF"}にしました`, { on: nextState });
    }

    function fmtTemp(val) {
      return val === null || val === undefined ? "--" : Number(val).toFixed(1);
    }

    const MACHINE_STATUS_LABELS = {
      READY: "待機中",
      BUILDING_FROM_SD: "印刷中",
      BUILDING_COMPLETED: "印刷完了",
      PAUSED: "一時停止中",
      PAUSE: "一時停止中",
      DISCONNECTED: "未接続",
      UNKNOWN: "不明",
    };

    function formatMachineStatus(status) {
      const code = status || "UNKNOWN";
      return MACHINE_STATUS_LABELS[code] || code;
    }

    async function fetchStatus() {
      const dot = document.getElementById("conn-dot");
      const connText = document.getElementById("conn-text");

      try {
        const res = await fetch("/api/printer/status");
        const data = await res.json();

        if (data.connected) {
          dot.className = "dot online";
          connText.textContent = "接続中";
        } else {
          dot.className = "dot offline";
          connText.textContent = "未接続";
        }

        const nozzle = data.temperatures?.nozzle || {};
        const bed = data.temperatures?.bed || {};
        document.getElementById("nozzle-actual").textContent = fmtTemp(nozzle.actual);
        document.getElementById("nozzle-target").textContent = fmtTemp(nozzle.target);
        document.getElementById("bed-actual").textContent = fmtTemp(bed.actual);
        document.getElementById("bed-target").textContent = fmtTemp(bed.target);

        const progress = data.progress || {};
        const pct = Number(progress.percent || 0).toFixed(1);
        document.getElementById("progress-percent").textContent = `${pct}%`;
        document.getElementById("progress-fill").style.width = `${pct}%`;
        const machineStatusEl = document.getElementById("machine-status");
        const rawStatus = data.machine_status || "UNKNOWN";
        machineStatusEl.textContent = `状態: ${formatMachineStatus(rawStatus)}`;
        machineStatusEl.title = rawStatus;

        const fileText = data.current_file ? `ファイル: ${data.current_file}` : "ファイル: なし";
        document.getElementById("current-file").textContent = fileText;

        if (data.led !== null && data.led !== undefined) {
          currentLedState = Boolean(data.led);
          document.getElementById("led-btn").textContent = `LED: ${currentLedState ? "ON" : "OFF"}`;
        }

        if (data.connected) {
          appendTempSample(nozzle, bed);
        }
        updateCameraStatus(data.camera);
      } catch (err) {
        dot.className = "dot offline";
        connText.textContent = "サーバー通信エラー";
        updateCameraStatus(null);
      }
    }

    function updateCameraStatus(cam) {
      const dot = document.getElementById("cam-dot");
      const text = document.getElementById("cam-status-text");
      const badge = document.getElementById("camera-status-badge");
      if (!cam) {
        dot.className = "dot";
        text.textContent = "不明";
        badge.title = "";
        return;
      }

      const viewers = Number(cam.active_clients || 0);
      const age = cam.last_frame_age_seconds;
      const viewerLabel = viewers > 0 ? ` (視聴:${viewers})` : "";
      const ageLabel = age !== null && age !== undefined ? ` / 最終フレーム ${age}s前` : "";

      if (cam.upstream_connected) {
        if (age !== null && age !== undefined && age >= 10) {
          dot.className = "dot warn";
          text.textContent = `応答待ち${viewerLabel}`;
        } else {
          dot.className = "dot online";
          text.textContent = `受信中${viewerLabel}`;
        }
        badge.title = `カメラ接続中${ageLabel}`;
      } else if (cam.last_error) {
        dot.className = "dot offline";
        text.textContent = "切断 / 再接続待ち";
        badge.title = cam.last_error;
      } else {
        dot.className = "dot";
        text.textContent = cam.auto_snapshot_active ? "接続準備中" : "待機中";
        badge.title = `視聴:${viewers}${ageLabel}`;
      }
    }

    // --- Temperature History Chart ---
    let tempSamples = [];
    let chartHoverX = null;

    function appendTempSample(nozzle, bed) {
      if (nozzle.actual === null && bed.actual === null) return;
      const now = Date.now();
      const last = tempSamples[tempSamples.length - 1];
      if (!last || now - last.ts >= 4500) {
        tempSamples.push({
          ts: now,
          nozzle_actual: nozzle.actual,
          nozzle_target: nozzle.target,
          bed_actual: bed.actual,
          bed_target: bed.target,
        });
        const cutoff = now - 4 * 3600 * 1000;
        while (tempSamples.length > 0 && tempSamples[0].ts < cutoff) {
          tempSamples.shift();
        }
        drawTempChart();
      }
    }

    async function fetchTempHistory() {
      try {
        const res = await fetch("/api/history/temperature");
        if (!res.ok) return;
        const data = await res.json();
        if (Array.isArray(data.samples)) {
          tempSamples = data.samples;
          drawTempChart();
        }
      } catch (_) {}
    }

    function fmtClock(ms) {
      const d = new Date(ms);
      return d.toTimeString().slice(0, 5);
    }

    function drawTempChart() {
      const canvas = document.getElementById("temp-chart");
      const wrap = document.getElementById("chart-wrap");
      const dpr = window.devicePixelRatio || 1;
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      if (w <= 0 || h <= 0) return;

      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);

      const rangeMin = Number(document.getElementById("temp-range").value || 240);
      const now = Date.now();
      const minTs = now - rangeMin * 60 * 1000;
      const visible = tempSamples.filter((s) => s.ts >= minTs);

      const pad = { top: 14, right: 14, bottom: 26, left: 42 };
      const plotW = w - pad.left - pad.right;
      const plotH = h - pad.top - pad.bottom;

      let maxTemp = 80;
      for (const s of visible) {
        for (const k of ["nozzle_actual", "nozzle_target", "bed_actual", "bed_target"]) {
          if (typeof s[k] === "number" && s[k] > maxTemp) maxTemp = s[k];
        }
      }
      maxTemp = Math.ceil((maxTemp + 15) / 20) * 20;

      // Grid & Y labels
      ctx.strokeStyle = "#252a33";
      ctx.fillStyle = "#8b949e";
      ctx.font = "11px sans-serif";
      ctx.lineWidth = 1;
      const ySteps = 4;
      for (let i = 0; i <= ySteps; i++) {
        const val = (maxTemp / ySteps) * i;
        const y = pad.top + plotH - (val / maxTemp) * plotH;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + plotW, y);
        ctx.stroke();
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText(`${Math.round(val)}°`, pad.left - 6, y);
      }

      // X labels
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const xTicks = 4;
      for (let i = 0; i <= xTicks; i++) {
        const t = minTs + ((now - minTs) * i) / xTicks;
        const x = pad.left + (plotW * i) / xTicks;
        ctx.fillText(fmtClock(t), x, pad.top + plotH + 6);
      }

      if (visible.length === 0) {
        ctx.fillStyle = "#8b949e";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("データ収集中...", pad.left + plotW / 2, pad.top + plotH / 2);
        return;
      }

      const toX = (ts) => pad.left + ((ts - minTs) / Math.max(1, now - minTs)) * plotW;
      const toY = (val) => pad.top + plotH - (Math.max(0, val) / maxTemp) * plotH;

      const series = [
        { key: "nozzle_target", color: "#ff9b96", dashed: true },
        { key: "bed_target", color: "#9bc9ff", dashed: true },
        { key: "nozzle_actual", color: "#f85149", dashed: false },
        { key: "bed_actual", color: "#58a6ff", dashed: false },
      ];

      for (const ser of series) {
        ctx.save();
        ctx.strokeStyle = ser.color;
        ctx.lineWidth = ser.dashed ? 1.5 : 2;
        ctx.setLineDash(ser.dashed ? [4, 4] : []);
        ctx.beginPath();
        let started = false;
        for (const s of visible) {
          const val = s[ser.key];
          if (typeof val !== "number") {
            started = false;
            continue;
          }
          const x = toX(s.ts);
          const y = toY(val);
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.stroke();
        ctx.restore();
      }

      // Hover crosshair & tooltip
      const tooltip = document.getElementById("chart-tooltip");
      if (chartHoverX !== null && chartHoverX >= pad.left && chartHoverX <= pad.left + plotW) {
        const hoverTs = minTs + ((chartHoverX - pad.left) / plotW) * (now - minTs);
        let nearest = visible[0];
        let bestDist = Math.abs(nearest.ts - hoverTs);
        for (const s of visible) {
          const d = Math.abs(s.ts - hoverTs);
          if (d < bestDist) {
            bestDist = d;
            nearest = s;
          }
        }
        const nx = toX(nearest.ts);
        ctx.save();
        ctx.strokeStyle = "rgba(230, 237, 243, 0.35)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(nx, pad.top);
        ctx.lineTo(nx, pad.top + plotH);
        ctx.stroke();
        ctx.restore();

        tooltip.style.display = "block";
        tooltip.innerHTML =
          `<div><strong>${fmtClock(nearest.ts)}</strong></div>` +
          `<div>ノズル: ${fmtTemp(nearest.nozzle_actual)}°C / ${fmtTemp(nearest.nozzle_target)}°C</div>` +
          `<div>ベッド: ${fmtTemp(nearest.bed_actual)}°C / ${fmtTemp(nearest.bed_target)}°C</div>`;
        const left = nx + 12 + tooltip.offsetWidth > w ? nx - tooltip.offsetWidth - 12 : nx + 12;
        tooltip.style.left = `${Math.max(6, left)}px`;
        tooltip.style.top = "10px";
      } else {
        tooltip.style.display = "none";
      }
    }

    const chartCanvas = document.getElementById("temp-chart");
    chartCanvas.addEventListener("mousemove", (e) => {
      const rect = chartCanvas.getBoundingClientRect();
      chartHoverX = e.clientX - rect.left;
      drawTempChart();
    });
    chartCanvas.addEventListener("mouseleave", () => {
      chartHoverX = null;
      drawTempChart();
    });
    window.addEventListener("resize", drawTempChart);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(drawTempChart).observe(document.getElementById("chart-wrap"));
    }

    // --- Camera Snapshot History ---
    let snapshotsChrono = [];
    let selectedSnapIndex = -1;

    async function fetchSnapshots(selectLatest = false) {
      try {
        const res = await fetch("/api/camera/snapshots");
        if (!res.ok) return;
        const data = await res.json();

        const policyEl = document.getElementById("snapshot-policy");
        if (data.enabled) {
          const mode = data.only_while_printing ? "印刷中のみ" : "常時";
          policyEl.textContent = `自動: ${mode} ${data.interval_seconds}s`;
        } else {
          policyEl.textContent = "自動保存: OFF";
        }

        const list = Array.isArray(data.snapshots) ? data.snapshots : [];
        // API returns newest-first; reverse for chronological slider (left=oldest, right=newest)
        const wasAtLatest = selectedSnapIndex === -1 || selectedSnapIndex === snapshotsChrono.length - 1;
        snapshotsChrono = list.slice().reverse();

        if (snapshotsChrono.length === 0) {
          selectedSnapIndex = -1;
        } else if (selectLatest || wasAtLatest || selectedSnapIndex >= snapshotsChrono.length) {
          selectedSnapIndex = snapshotsChrono.length - 1;
        }
        renderSnapshotViewer();
      } catch (_) {}
    }

    function renderSnapshotViewer() {
      const preview = document.getElementById("snapshot-preview");
      const slider = document.getElementById("snapshot-slider");
      const prevBtn = document.getElementById("snap-prev-btn");
      const nextBtn = document.getElementById("snap-next-btn");
      const timeEl = document.getElementById("snapshot-time");
      const countEl = document.getElementById("snapshot-count");
      const thumbs = document.getElementById("snapshot-thumbs");

      const total = snapshotsChrono.length;
      if (total === 0 || selectedSnapIndex < 0) {
        preview.innerHTML = "<span>保存された静止画はありません</span>";
        slider.disabled = true;
        slider.max = 0;
        slider.value = 0;
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        timeEl.textContent = "--";
        countEl.textContent = "0 / 0";
        thumbs.innerHTML = "";
        return;
      }

      const item = snapshotsChrono[selectedSnapIndex];
      preview.innerHTML = `<img src="${item.url}" alt="${item.filename}" />`;
      slider.disabled = false;
      slider.min = 0;
      slider.max = total - 1;
      slider.value = selectedSnapIndex;
      prevBtn.disabled = selectedSnapIndex <= 0;
      nextBtn.disabled = selectedSnapIndex >= total - 1;
      timeEl.textContent = item.label || item.filename;
      countEl.textContent = `${selectedSnapIndex + 1} / ${total}`;

      thumbs.innerHTML = "";
      // Show newest thumbnails first in the strip for quick access
      for (let i = total - 1; i >= 0; i--) {
        const s = snapshotsChrono[i];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "thumb-item" + (i === selectedSnapIndex ? " active" : "");
        btn.title = s.label || s.filename;
        btn.onclick = () => {
          selectedSnapIndex = i;
          renderSnapshotViewer();
        };
        btn.innerHTML = `<img src="${s.url}" alt="${s.filename}" loading="lazy" />`;
        thumbs.appendChild(btn);
      }
    }

    function selectSnapshotBySlider(val) {
      selectedSnapIndex = Number(val);
      renderSnapshotViewer();
    }

    function stepSnapshot(delta) {
      if (snapshotsChrono.length === 0) return;
      selectedSnapIndex = Math.max(
        0,
        Math.min(snapshotsChrono.length - 1, selectedSnapIndex + delta)
      );
      renderSnapshotViewer();
    }

    fetchTempHistory();
    fetchSnapshots(true);
    fetchStatus();
    setInterval(fetchStatus, 2500);
    setInterval(() => fetchSnapshots(false), 15000);
  </script>
</body>
</html>
